# Generated by SmartDNS WebUI form mode.
# 表单模式会按当前启用的参数重新生成配置内容。

audit-console yes
audit-enable yes
audit-file /var/log/smartdns/smartdns-audit.log
audit-file-mode 644
audit-num 2
audit-size 1m
bind [::]:53
bind :6053
cache-checkpoint-time 86400
cache-file /var/cache/smartdns.cache
cache-persist yes
cache-size 65536
force-AAAA-SOA yes
force-qtype-SOA 65
log-console yes
log-file /var/log/smartdns/smartdns.log
log-file-mode 644
log-level info
log-num 8
log-size 1m
plugin smartdns_ui.so
prefetch-domain yes
response-mode fastest-response
rr-ttl-max 86400
rr-ttl-min 300
serve-expired yes
server-https https://223.5.5.5/dns-query
server-https https://1.12.12.12/dns-query
server-name smartdns
smartdns-ui.conf-file /etc/smartdns/smartdns.conf
smartdns-ui.enable-cors yes
smartdns-ui.enable-terminal yes
smartdns-ui.ip http://0.0.0.0:6080
smartdns-ui.max-query-log-age 86400
smartdns-ui.password password
smartdns-ui.token-expire 600
smartdns-ui.user admin
smartdns-ui.www-root /usr/share/smartdns/wwwroot
speed-check-mode speed-check-mode ping,tcp:80,tcp:443
