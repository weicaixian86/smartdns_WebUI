name: Debian 12 amd64 and Linux Generic Build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-packages:
    runs-on: ubuntu-latest
    container:
      image: debian:12

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            clang \
            curl \
            dpkg-dev \
            file \
            gh \
            git \
            libclang-dev \
            libssl-dev \
            make \
            pkg-config \
            unzip \
            wget \
            xz-utils

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare build metadata
        id: meta
        shell: bash
        run: |
          build_no="${{ github.run_number }}"
          build_date="$(TZ=Asia/Shanghai date +%Y.%m.%d)"
          version="${build_no}.${build_date}"
          deb_name="smartdns.${version}.amd64-debian-all.deb"
          linux_name="smartdns.${version}.x86_64-linux-all.tar.gz"
          release_tag="packages-${version}"
          release_name="SmartDNS Debian 12 amd64 and Linux Generic ${version}"
          release_notes_file="$RUNNER_TEMP/package-release-notes.md"

          cat > "$release_notes_file" <<EOF
          Automated Debian 12 amd64 and Linux generic package release.

          - Debian Package: \`${deb_name}\`
          - Linux Generic Package: \`${linux_name}\`
          - Build No: \`${build_no}\`
          - Build Date: \`${build_date}\`
          - Source Ref: \`${GITHUB_REF}\`
          - Commit: \`${GITHUB_SHA}\`
          EOF

          echo "build_no=${build_no}" >> "$GITHUB_OUTPUT"
          echo "build_date=${build_date}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "deb_name=${deb_name}" >> "$GITHUB_OUTPUT"
          echo "linux_name=${linux_name}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "release_name=${release_name}" >> "$GITHUB_OUTPUT"
          echo "release_notes_file=${release_notes_file}" >> "$GITHUB_OUTPUT"

      - name: Build Debian 12 amd64 and Linux generic packages
        shell: bash
        run: |
          mkdir -p dist
          chmod +x package/build-pkg.sh
          ./package/build-pkg.sh \
            --platform debian \
            --arch amd64 \
            --filearch amd64-debian-all \
            --ver "${{ steps.meta.outputs.version }}" \
            --with-ui \
            --outputdir "$PWD/dist"
          ./package/build-pkg.sh \
            --platform linux \
            --arch x86-64 \
            --filearch x86_64-linux-all \
            --ver "${{ steps.meta.outputs.version }}" \
            --with-ui \
            --outputdir "$PWD/dist"
          test -f "dist/${{ steps.meta.outputs.deb_name }}"
          test -f "dist/${{ steps.meta.outputs.linux_name }}"
          ls -lah dist

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: smartdns-${{ steps.meta.outputs.version }}-packages
          path: |
            dist/${{ steps.meta.outputs.deb_name }}
            dist/${{ steps.meta.outputs.linux_name }}
          if-no-files-found: error

      - name: Publish package release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          RELEASE_NAME: ${{ steps.meta.outputs.release_name }}
          RELEASE_NOTES_FILE: ${{ steps.meta.outputs.release_notes_file }}
          DEB_NAME: ${{ steps.meta.outputs.deb_name }}
          LINUX_NAME: ${{ steps.meta.outputs.linux_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "dist/$DEB_NAME" "dist/$LINUX_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_NAME" \
              --notes-file "$RELEASE_NOTES_FILE"
          else
            gh release create "$RELEASE_TAG" "dist/$DEB_NAME" "dist/$LINUX_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_NAME" \
              --notes-file "$RELEASE_NOTES_FILE"
          fi
