name: Debian 12 amd64 Deb Build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debian12-deb:
    runs-on: ubuntu-latest
    container:
      image: debian:12

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            clang \
            curl \
            dpkg-dev \
            file \
            gh \
            git \
            libclang-dev \
            libssl-dev \
            make \
            pkg-config \
            unzip \
            wget \
            xz-utils

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare build metadata
        id: meta
        shell: bash
        run: |
          build_no="${{ github.run_number }}"
          build_date="$(TZ=Asia/Shanghai date +%Y.%m.%d)"
          version="${build_no}.${build_date}"
          deb_name="smartdns.${version}.amd64-debian-all.deb"
          release_tag="deb-${version}"
          release_name="SmartDNS Debian 12 amd64 ${version}"
          release_notes_file="$RUNNER_TEMP/debian12-amd64-release-notes.md"

          cat > "$release_notes_file" <<EOF
          Automated Debian 12 amd64 package release.

          - Package: \`${deb_name}\`
          - Build No: \`${build_no}\`
          - Build Date: \`${build_date}\`
          - Source Ref: \`${GITHUB_REF}\`
          - Commit: \`${GITHUB_SHA}\`
          EOF

          echo "build_no=${build_no}" >> "$GITHUB_OUTPUT"
          echo "build_date=${build_date}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "deb_name=${deb_name}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "release_name=${release_name}" >> "$GITHUB_OUTPUT"
          echo "release_notes_file=${release_notes_file}" >> "$GITHUB_OUTPUT"

      - name: Build Debian 12 amd64 package
        shell: bash
        run: |
          mkdir -p dist
          chmod +x package/build-pkg.sh
          ./package/build-pkg.sh \
            --platform debian \
            --arch amd64 \
            --filearch amd64-debian-all \
            --ver "${{ steps.meta.outputs.version }}" \
            --with-ui \
            --outputdir "$PWD/dist"
          test -f "dist/${{ steps.meta.outputs.deb_name }}"
          ls -lah dist

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.deb_name }}
          path: dist/${{ steps.meta.outputs.deb_name }}
          if-no-files-found: error

      - name: Publish Debian package release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          RELEASE_NAME: ${{ steps.meta.outputs.release_name }}
          RELEASE_NOTES_FILE: ${{ steps.meta.outputs.release_notes_file }}
          DEB_NAME: ${{ steps.meta.outputs.deb_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "dist/$DEB_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_NAME" \
              --notes-file "$RELEASE_NOTES_FILE"
          else
            gh release create "$RELEASE_TAG" "dist/$DEB_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_NAME" \
              --notes-file "$RELEASE_NOTES_FILE"
          fi
