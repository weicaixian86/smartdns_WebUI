name: Debian 12 amd64 Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:12

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            build-essential \
            clang \
            curl \
            git \
            libclang-dev \
            libssl-dev \
            pkg-config \
            unzip \
            wget \
            xz-utils

      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          profile: minimal
          toolchain: stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare package version
        run: |
          build_date="$(TZ=Asia/Shanghai date +%Y.%m.%d)"
          package_version="${GITHUB_RUN_NUMBER}.${build_date}"
          echo "PACKAGE_VERSION=${package_version}" >> "$GITHUB_ENV"
          echo "PACKAGE_FILE=smartdns.${package_version}.amd64-debian-all.deb" >> "$GITHUB_ENV"

      - name: Build Debian package
        run: |
          mkdir -p package/out
          package/build-pkg.sh \
            --platform debian \
            --arch amd64 \
            --filearch amd64-debian-all \
            --with-ui \
            --ver "$PACKAGE_VERSION" \
            --outputdir package/out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_FILE }}
          path: package/out/${{ env.PACKAGE_FILE }}
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debian12-amd64-${{ env.PACKAGE_VERSION }}
          name: Debian 12 amd64 ${{ env.PACKAGE_VERSION }}
          files: package/out/${{ env.PACKAGE_FILE }}
